<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The title, description, canonical, per-page Open Graph tags and the
         LocalBusiness JSON-LD are NOT written here. vite/seoPrerender.ts
         injects them as a marked block (see SEO_BLOCK_START in
         src/seo/staticHead.ts) in dev and in the build, and writes one copy
         of this document per route into dist/, so that scrapers which never
         run JavaScript get the right head for the URL they asked for.
         Adding a title or description back here would duplicate them. -->
    <meta name="theme-color" content="#26397f" />
    <!-- favicon.ico first for browsers and crawlers that ask for it by
         name; Google's search results want a square of at least 48 px.
         The SVG wins where it is supported. Regenerate the raster files
         from favicon.svg if it changes. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The hero photo is the LCP element, but it is rendered by React, so
         the preload scanner never sees it in the markup and the download
         cannot start until the bundle has parsed and mounted. Preloading it
         here starts the fetch with the very first bytes of HTML instead.
         Keep the type/srcset in step with <Hero>. -->
    <link
      rel="preload"
      as="image"
      href="/images/hero.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Open Graph constants (shared links in WhatsApp/Instagram/Facebook).
         Title/description/url/locale and the share image (its alt text is
         translated) are per route and per language, so they live in the
         injected block instead. -->
    <meta property="og:site_name" content="elcorix" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Match the app background before CSS loads (no flash). */
      html {
        background-color: #ffffff;
      }
    </style>
    <noscript>
      <!-- The page is prerendered, so it reads fine without JavaScript —
           except that the scroll reveals (components/Reveal.tsx) start at
           opacity 0 and are flipped by script. With no script to flip
           them, show everything at once. -->
      <style>
        .reveal,
        .reveal-fade {
          opacity: 1 !important;
          transform: none !important;
          transition: none !important;
        }
        /* The technology write-up opens with a button (sections/Technology.tsx):
           without script, show it expanded and drop the dead toggle. This
           works because it is unlayered: an [hidden] attribute would lose to
           Tailwind's layered `display: none !important` in preflight. */
        #technology-more {
          display: block !important;
        }
        [data-js-only] {
          display: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
