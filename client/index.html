<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The title, description, canonical, per-page Open Graph tags and the
         LocalBusiness JSON-LD are NOT written here. vite/seoPrerender.ts
         injects them as a marked block (see SEO_BLOCK_START in
         src/seo/staticHead.ts) in dev and in the build, and writes one copy
         of this document per route into dist/, so that scrapers which never
         run JavaScript get the right head for the URL they asked for.
         Adding a title or description back here would duplicate them. -->
    <meta name="theme-color" content="#26397f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The hero photo is the LCP element, but it is rendered by React, so
         the preload scanner never sees it in the markup and the download
         cannot start until the bundle has parsed and mounted. Preloading it
         here starts the fetch with the very first bytes of HTML instead.
         Keep the type/srcset in step with <Hero>. -->
    <link
      rel="preload"
      as="image"
      href="/images/hero.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Open Graph constants (shared links in WhatsApp/Instagram/Facebook).
         Title/description/url/locale are per route and per language, so
         they live in the injected block instead. -->
    <meta property="og:site_name" content="elcorix" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://elcorix.de/images/hero.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Match the app background before CSS loads (no flash). */
      html {
        background-color: #ffffff;
      }
    </style>
    <noscript>
      <!-- The page is prerendered, so it reads fine without JavaScript —
           except that the scroll reveals (components/Reveal.tsx) start at
           opacity 0 and are flipped by script. With no script to flip
           them, show everything at once. -->
      <style>
        .reveal,
        .reveal-fade {
          opacity: 1 !important;
          transform: none !important;
          transition: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
