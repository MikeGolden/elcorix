<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Default (German) description; usePageMeta overwrites it per route
         and language once the app mounts. -->
    <meta
      name="description"
      content="elcorix — dauerhafte Laser-Haarentfernung in Kempten. Moderne Diodenlaser-Technologie, individuell auf Ihre Haut abgestimmt. Termin online buchen."
    />
    <meta name="theme-color" content="#26397f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The hero photo is the LCP element, but it is rendered by React, so
         the preload scanner never sees it in the markup and the download
         cannot start until the bundle has parsed and mounted. Preloading it
         here starts the fetch with the very first bytes of HTML instead.
         Keep the type/srcset in step with <Hero>. -->
    <link
      rel="preload"
      as="image"
      href="/images/hero.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Open Graph defaults (shared links in WhatsApp/Instagram/Facebook).
         Title/description/url are updated per route by usePageMeta. -->
    <meta property="og:site_name" content="elcorix" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://elcorix.com/images/hero.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>elcorix — Laser-Haarentfernung in Kempten</title>
    <style>
      /* Match the app background before CSS loads (no flash). */
      html {
        background-color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
