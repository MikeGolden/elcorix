# Container logs. The server's request log (morgan "combined") and nginx's
# access log carry visitor IP addresses; the privacy policy (Stand
# 17.09.2026, § 3) promises they are deleted after at most seven days.
# The size cap below only bounds disk use — Docker has no age limit — so the
# log-retention service further down enforces the seven days.
# Every service: a process can never gain privileges it did not start with
# (setuid binaries, file capabilities). Dropping privileges — postgres and
# nginx starting as root and switching user — still works.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kosmetic
      POSTGRES_USER: kosmetic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kosmetic}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosmetic -d kosmetic"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Nightly logical backups of the database into the ./backups folder
  # (BACKUP_KEEP_DAYS rotates old dumps). A named volume is not a backup —
  # copy ./backups off the host regularly.
  db-backup:
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-kosmetic}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U kosmetic -d kosmetic -Fc -f "/backups/kosmetic-$$(date +%Y%m%d-%H%M%S).dump" &&
        find /backups -name "kosmetic-*.dump" -mtime +$${BACKUP_KEEP_DAYS} -delete;
        sleep 86400;
      done'

  server:
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://kosmetic:${POSTGRES_PASSWORD:-kosmetic}@db:5432/kosmetic
      ALTEGIO_COMPANY_ID: ${ALTEGIO_COMPANY_ID:-000000}
      # nginx (the client container) is the single proxy hop in front.
      TRUST_PROXY_HOPS: 1
      # E-mail notifications for contact/booking requests (optional — the
      # records are stored in Postgres either way). See .env.example.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}
      # Telegram notifications for consultation requests (optional).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # GDPR retention window for stored requests (months).
      RETENTION_MONTHS: ${RETENTION_MONTHS:-6}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    # 3001 is intentionally not published — nginx proxies /api same-origin.

  client:
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_ALTEGIO_COMPANY_ID: ${ALTEGIO_COMPANY_ID:-000000}
        VITE_ENABLE_ALTEGIO: ${VITE_ENABLE_ALTEGIO:-false}
        VITE_ANALYTICS_SRC: ${VITE_ANALYTICS_SRC:-}
        VITE_ANALYTICS_DOMAIN: ${VITE_ANALYTICS_DOMAIN:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy

  # Enforces the seven-day limit on server logs from the privacy policy
  # (§ 3). Docker's json-file driver only rotates by size, so once a day
  # this drops every log line older than LOG_RETENTION_DAYS from the
  # containers of this host and deletes rotated files that are entirely
  # older. It needs the host's container log directory, read-write.
  log-retention:
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    image: alpine:3.20
    restart: unless-stopped
    environment:
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
    volumes:
      - /var/lib/docker/containers:/containers
      - ./docker/prune-logs.sh:/prune-logs.sh:ro
    entrypoint: >
      sh -c 'while true; do sh /prune-logs.sh /containers; sleep 86400; done'

  # Encrypted off-site copy of ./backups — a dump on the same disk as the
  # database dies with the server. restic over SFTP to a Hetzner Storage
  # Box (or any restic repository). Opt-in: runs only with
  # `--profile offsite`; setup in SECURITY.md → "Off-site backups".
  # Dumps hold customer contact data: restic encrypts them client-side, and
  # OFFSITE_KEEP (default 14d) matches BACKUP_KEEP_DAYS so deleted requests
  # do not outlive the retention promised in the privacy policy.
  offsite-backup:
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    image: restic/restic:0.18.0
    profiles: [offsite]
    restart: unless-stopped
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      OFFSITE_KEEP: ${OFFSITE_KEEP:-14d}
    volumes:
      - ./backups:/backups:ro
      - ./docker/restic-ssh:/ssh:ro
      - ./docker/offsite-backup.sh:/offsite-backup.sh:ro
      - restic-cache:/root/.cache/restic
    entrypoint: ["sh", "/offsite-backup.sh"]

volumes:
  db-data:
  restic-cache:
