services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kosmetic
      POSTGRES_USER: kosmetic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kosmetic}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosmetic -d kosmetic"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://kosmetic:${POSTGRES_PASSWORD:-kosmetic}@db:5432/kosmetic
      ALTEGIO_COMPANY_ID: ${ALTEGIO_COMPANY_ID:-000000}
      # nginx (the client container) is the single proxy hop in front.
      TRUST_PROXY_HOPS: 1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    # 3001 is intentionally not published — nginx proxies /api same-origin.

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_ALTEGIO_COMPANY_ID: ${ALTEGIO_COMPANY_ID:-000000}
        # Compose reads overrides from .env (not .env.local, which only
        # dev servers load). Defaults to self-hosted images.
        VITE_LOCAL_IMAGES: ${VITE_LOCAL_IMAGES:-true}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  db-data:
