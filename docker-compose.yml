services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kosmetic
      POSTGRES_USER: kosmetic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kosmetic}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosmetic -d kosmetic"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Nightly logical backups of the database into the ./backups folder
  # (BACKUP_KEEP_DAYS rotates old dumps). A named volume is not a backup —
  # copy ./backups off the host regularly.
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-kosmetic}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U kosmetic -d kosmetic -Fc -f "/backups/kosmetic-$$(date +%Y%m%d-%H%M%S).dump" &&
        find /backups -name "kosmetic-*.dump" -mtime +$${BACKUP_KEEP_DAYS} -delete;
        sleep 86400;
      done'

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://kosmetic:${POSTGRES_PASSWORD:-kosmetic}@db:5432/kosmetic
      ALTEGIO_COMPANY_ID: ${ALTEGIO_COMPANY_ID:-000000}
      # nginx (the client container) is the single proxy hop in front.
      TRUST_PROXY_HOPS: 1
      # E-mail notifications for contact/booking requests (optional — the
      # records are stored in Postgres either way). See .env.example.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}
      # Telegram notifications for consultation requests (optional).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # GDPR retention window for stored requests (months).
      RETENTION_MONTHS: ${RETENTION_MONTHS:-12}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    # 3001 is intentionally not published — nginx proxies /api same-origin.

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_ALTEGIO_COMPANY_ID: ${ALTEGIO_COMPANY_ID:-000000}
        VITE_ANALYTICS_SRC: ${VITE_ANALYTICS_SRC:-}
        VITE_ANALYTICS_DOMAIN: ${VITE_ANALYTICS_DOMAIN:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  db-data:
