# Container logs. The server's request log (morgan "combined") and nginx's
# access log carry visitor IP addresses; the privacy policy (Stand
# 17.09.2026, § 3) promises they are deleted after at most seven days.
# The size cap below only bounds disk use — Docker has no age limit — so the
# log-retention service further down enforces the seven days.
# Every service: a process can never gain privileges it did not start with
# (setuid binaries, file capabilities). Dropping privileges — postgres and
# nginx starting as root and switching user — still works.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kosmetic
      POSTGRES_USER: kosmetic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kosmetic}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosmetic -d kosmetic"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Nightly logical backups of the database into the ./backups folder
  # (BACKUP_KEEP_DAYS rotates old dumps). A named volume is not a backup —
  # copy ./backups off the host regularly.
  db-backup:
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-kosmetic}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    # The Umami analytics database (profile "analytics") is dumped too
    # when it exists; its dumps rotate on the same BACKUP_KEEP_DAYS.
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U kosmetic -d kosmetic -Fc -f "/backups/kosmetic-$$(date +%Y%m%d-%H%M%S).dump" &&
        find /backups -name "kosmetic-*.dump" -mtime +$${BACKUP_KEEP_DAYS} -delete;
        if [ "$$(psql -h db -U kosmetic -d kosmetic -tAc "SELECT 1 FROM pg_database WHERE datname = '"'"'umami'"'"'")" = "1" ]; then
          pg_dump -h db -U kosmetic -d umami -Fc -f "/backups/umami-$$(date +%Y%m%d-%H%M%S).dump";
          find /backups -name "umami-*.dump" -mtime +$${BACKUP_KEEP_DAYS} -delete;
        fi;
        sleep 86400;
      done'

  server:
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://kosmetic:${POSTGRES_PASSWORD:-kosmetic}@db:5432/kosmetic
      ALTEGIO_COMPANY_ID: ${ALTEGIO_COMPANY_ID:-000000}
      # nginx (the client container) is the single proxy hop in front.
      TRUST_PROXY_HOPS: 1
      # E-mail notifications for contact/booking requests (optional — the
      # records are stored in Postgres either way). See .env.example.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}
      # Telegram notifications for consultation requests (optional).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # GDPR retention window for stored requests (months).
      RETENTION_MONTHS: ${RETENTION_MONTHS:-6}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    # 3001 is intentionally not published — nginx proxies /api same-origin.

  client:
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_ALTEGIO_COMPANY_ID: ${ALTEGIO_COMPANY_ID:-000000}
        VITE_ENABLE_ALTEGIO: ${VITE_ENABLE_ALTEGIO:-false}
        # Umami tracker (profile "analytics" below). Empty id = no tracker,
        # no analytics section in the privacy policy — see client/src/analytics.ts.
        VITE_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
        VITE_UMAMI_DOMAINS: ${UMAMI_DOMAINS:-elcorix.com,elcorix.de,elcorix.eu}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy

  # ── Analytics: self-hosted Umami ────────────────────────────────────
  # Opt-in with the "analytics" profile — put COMPOSE_PROFILES=analytics in
  # .env on the server (CI and local runs stay without it). Umami gets its
  # own role and database in the existing Postgres, the dashboard is served
  # on stats.<domain> by Caddy (docker/Caddyfile), and nginx exposes only
  # the tracker script and its collect endpoint first-party under /u/
  # (docker/nginx.conf). Setup: README → "Analytics (Umami)".
  #
  # All three services start only when UMAMI_DB_PASSWORD and
  # UMAMI_APP_SECRET are set — the check sits in umami-db-init because a
  # `${VAR:?}` here would break `docker compose up` without the profile too.

  # One-shot: creates/updates the umami role and database, then exits.
  umami-db-init:
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    image: postgres:16-alpine
    profiles: [analytics]
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-kosmetic}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:-}
      UMAMI_APP_SECRET: ${UMAMI_APP_SECRET:-}
    volumes:
      - ./docker/umami-db-init.sql:/umami-db-init.sql:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      sh -c 'if [ -z "$$UMAMI_DB_PASSWORD" ] || [ -z "$$UMAMI_APP_SECRET" ]; then
        echo "umami: set UMAMI_DB_PASSWORD and UMAMI_APP_SECRET in .env (openssl rand -hex 32)" >&2; exit 1;
      fi;
      psql -h db -U kosmetic -d kosmetic -q -v umami_password="$$UMAMI_DB_PASSWORD" -f /umami-db-init.sql'

  umami:
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    # Major-version pin: minor/patch updates arrive with `docker compose
    # pull`; a v4 needs a deliberate change here (and a look at the notes).
    image: ghcr.io/umami-software/umami:3
    profiles: [analytics]
    restart: unless-stopped
    init: true
    environment:
      # Use a hex password (openssl rand -hex 32): it goes into a URL.
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      # The anonymous visitor hash (IP + user agent + salt) changes every
      # day, so nobody is recognised across days. The privacy policy states
      # this — do not switch to "month" without changing the policy.
      SALT_ROTATION: day
      # Read the visitor IP only from X-Forwarded-For. Caddy overwrites that
      # header with the real client address; without this Umami would trust
      # whichever of true-client-ip / cf-connecting-ip / x-real-ip … a
      # visitor chooses to send.
      CLIENT_IP_HEADER: x-forwarded-for
      # No calls home to Umami's servers from the dashboard.
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
      # Enables two-factor login on the dashboard (openssl rand -hex 32).
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_2FA_KEY:-}
    depends_on:
      umami-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/heartbeat"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    # Loopback only: the public way in is Caddy (stats.<domain>). Locally,
    # or through an SSH tunnel, the dashboard is http://localhost:3002.
    ports:
      - "127.0.0.1:${UMAMI_PORT:-3002}:3000"

  # Deletes analytics data older than UMAMI_RETENTION_MONTHS once a day —
  # the limit the privacy policy promises. Connects as the umami role, so
  # it cannot touch the customer database.
  umami-retention:
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    image: postgres:16-alpine
    profiles: [analytics]
    restart: unless-stopped
    environment:
      PGPASSWORD: ${UMAMI_DB_PASSWORD:-}
      UMAMI_RETENTION_MONTHS: ${UMAMI_RETENTION_MONTHS:-14}
    volumes:
      - ./docker/umami-retention.sql:/umami-retention.sql:ro
    depends_on:
      umami:
        condition: service_healthy
    entrypoint: >
      sh -c 'while true; do
        psql -h db -U umami -d umami -q -v keep_months="$$UMAMI_RETENTION_MONTHS" -f /umami-retention.sql;
        sleep 86400;
      done'

  # Enforces the seven-day limit on server logs from the privacy policy
  # (§ 3). Docker's json-file driver only rotates by size, so once a day
  # this drops every log line older than LOG_RETENTION_DAYS from the
  # containers of this host and deletes rotated files that are entirely
  # older. It needs the host's container log directory, read-write.
  log-retention:
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    image: alpine:3.20
    restart: unless-stopped
    environment:
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
    volumes:
      - /var/lib/docker/containers:/containers
      - ./docker/prune-logs.sh:/prune-logs.sh:ro
    entrypoint: >
      sh -c 'while true; do sh /prune-logs.sh /containers; sleep 86400; done'

  # Encrypted off-site copy of ./backups — a dump on the same disk as the
  # database dies with the server. restic over SFTP to a Hetzner Storage
  # Box (or any restic repository). Opt-in: runs only with
  # `--profile offsite`; setup in SECURITY.md → "Off-site backups".
  # Dumps hold customer contact data: restic encrypts them client-side, and
  # OFFSITE_KEEP (default 14d) matches BACKUP_KEEP_DAYS so deleted requests
  # do not outlive the retention promised in the privacy policy.
  offsite-backup:
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    image: restic/restic:0.18.0
    profiles: [offsite]
    restart: unless-stopped
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      OFFSITE_KEEP: ${OFFSITE_KEEP:-14d}
    volumes:
      - ./backups:/backups:ro
      - ./docker/restic-ssh:/ssh:ro
      - ./docker/offsite-backup.sh:/offsite-backup.sh:ro
      - restic-cache:/root/.cache/restic
    entrypoint: ["sh", "/offsite-backup.sh"]

volumes:
  db-data:
  restic-cache:
