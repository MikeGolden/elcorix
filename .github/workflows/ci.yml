name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: sh docker/db-backup.test.sh
      - run: node --test monitor/check.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Lighthouse mobile (the PageSpeed Insights profile) against the
  # production build — lighthouse/lighthouse.spec.ts. Median of 3 runs so
  # one noisy run on a shared runner cannot fail the build.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w client
      - run: npx playwright install --with-deps chromium
      - run: npm run test:lighthouse
        env:
          LH_RUNS: 3
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 14

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Real integration: nginx + API + Postgres, nothing mocked.
      - run: docker compose up -d --build --wait
      - run: npm run test:e2e:docker
      # db-backup dumps once on start: a restorable dump must be in
      # ./backups within a minute, or the backup service is broken.
      - name: db-backup writes a restorable dump
        run: |
          for i in $(seq 1 30); do
            dump=$(ls backups/kosmetic-*.dump 2>/dev/null | head -1)
            [ -n "$dump" ] && break
            sleep 2
          done
          test -n "$dump" || { docker compose logs db-backup; exit 1; }
          docker compose exec -T db pg_restore --list < "$dump" | grep -q "TABLE DATA"
      - run: docker compose logs
        if: failure()
      - run: docker compose down -v
        if: always()

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail the build on high/critical vulnerabilities in production deps.
      - run: npm audit --omit=dev --audit-level=high
      # Informational full audit (dev deps included) — does not fail the build.
      - run: npm audit --audit-level=low || true
