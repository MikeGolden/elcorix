name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Lighthouse mobile (the PageSpeed Insights profile) against the
  # production build — lighthouse/lighthouse.spec.ts. Median of 3 runs so
  # one noisy run on a shared runner cannot fail the build.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w client
      - run: npx playwright install --with-deps chromium
      - run: npm run test:lighthouse
        env:
          LH_RUNS: 3
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 14

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Real integration: nginx + API + Postgres, nothing mocked.
      - run: docker compose up -d --build --wait
      - run: npm run test:e2e:docker
      - run: docker compose logs
        if: failure()
      - run: docker compose down -v
        if: always()

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail the build on high/critical vulnerabilities in production deps.
      - run: npm audit --omit=dev --audit-level=high
      # Informational full audit (dev deps included) — does not fail the build.
      - run: npm audit --audit-level=low || true
