name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Real integration: nginx + API + Postgres, nothing mocked.
      - run: docker compose up -d --build --wait
      - run: npm run test:e2e:docker
      - run: docker compose logs
        if: failure()
      - run: docker compose down -v
        if: always()

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail the build on high/critical vulnerabilities in production deps.
      - run: npm audit --omit=dev --audit-level=high
      # Informational full audit (dev deps included) — does not fail the build.
      - run: npm audit --audit-level=low || true
