# Every URL the site used to serve, generated into the build by
# client/vite/seoPrerender.ts (src/seo/redirects.ts): the English slugs from
# before the URLs were localized, the unprefixed paths from before the
# language segments, and /privacy. The file ships inside the image next to
# index.html, so it is always present when nginx starts.
map $uri $legacy_target {
  default "";
  include /usr/share/nginx/html/_redirects.map;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Relative Location headers. nginx would otherwise build an absolute URL
  # from $scheme and $host — and $scheme is "http" in here, because Caddy
  # terminates TLS in front of this container, so every 301 would bounce
  # the visitor through plain http first.
  absolute_redirect off;

  # Security headers for the client site (see SECURITY.md).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # frame-src: Altegio booking embed (click-to-load) + the OpenStreetMap map,
  # which loads with the contact section.
  # The Umami tracker needs no entry: it is served same-origin under /u/
  # (see below), so 'self' already covers script-src and connect-src.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://*.alteg.io https://www.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  gzip on;
  gzip_min_length 1024;
  # text/xml is what nginx labels sitemap.xml; it is now 14kB of generated
  # URLs (9 routes x 3 languages, each with its hreflang alternates).
  gzip_types text/css application/javascript application/json image/svg+xml
             application/xml text/xml application/manifest+json;
  # Caches keyed on the URL alone would otherwise hand a gzipped body to a
  # client that did not ask for one.
  gzip_vary on;

  # One 301 for every URL this site has ever served. Cheap (a hash lookup
  # per request), and it means localizing the slugs cost no inbound link
  # and no ranking. `$is_args$args` keeps campaign parameters attached.
  if ($legacy_target) {
    return 301 $legacy_target$is_args$args;
  }

  # The map itself is build output, not content.
  location = /_redirects.map {
    return 404;
  }

  # Same-origin API: proxy to the Express container. The server has
  # TRUST_PROXY_HOPS=1 so rate limiting sees the real client IP.
  location /api/ {
    proxy_pass http://server:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Umami analytics, first-party (docker-compose.yml → umami, profile
  # "analytics"). Exactly two URLs are passed through — the tracker script
  # and the endpoint it posts to (the tracker derives it from its own
  # directory: /u/p.js → /u/api/send). The dashboard is NOT reachable here;
  # it lives on stats.<domain> via Caddy. Neutral paths, because blocklists
  # match "umami" and "script.js".
  #
  # The upstream is a variable resolved per request by Docker's DNS, so
  # nginx still starts when the umami container is not running (without
  # the profile, in CI, locally) — these two URLs then answer 502 and the
  # site is unaffected.
  location = /u/p.js {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $umami http://umami:3000;
    proxy_pass $umami/script.js;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /u/api/send {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $umami http://umami:3000;
    proxy_pass $umami/api/send;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Umami reads only this header (CLIENT_IP_HEADER) and takes the leftmost
    # address: Caddy writes the visitor's IP there, nginx appends Caddy's.
    # Umami uses it for the country/region lookup and the daily hash and
    # does not store it.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A pageview or event payload is well under 2 kB.
    client_max_body_size 16k;
  }

  # Hashed build assets are immutable — cache aggressively.
  # (`expires` keeps the server-level add_header directives, a nested
  # add_header would silently drop them.)
  location /assets/ {
    expires 1y;
  }

  # Photography under /images/ is served from public/, so the filenames are
  # NOT content-hashed: a long max-age would strand visitors on an old photo
  # after a reshoot. 30 days with revalidation is the compromise — repeat
  # visits skip ~400kB of downloads, and a replaced file is picked up on the
  # next conditional request rather than a month later.
  # Both blocks below use `expires` and nothing else, for the reason given
  # above: a single `add_header` here would drop every inherited security
  # header, CSP included.
  location /images/ {
    expires 30d;
  }

  # Root-level icons: stable files, but not under a content-hashed path,
  # so they would otherwise fall into the no-cache block below.
  location ~ ^/(favicon\.svg|logo\.svg|apple-touch-icon\.png)$ {
    expires 30d;
  }

  # Prerendered route shells (dist/de/preise/index.html and friends,
  # written by client/vite/seoPrerender.ts). Every URL the site serves has
  # a file, so anything that misses is genuinely unknown and gets a real
  # 404 — it used to fall back to index.html with a 200, which made every
  # typo and every scanner's guess an indexable copy of the home page.
  #
  # `=404` rather than a fallback, and `error_page` only inside this
  # location, so a missing image or hashed asset still gets nginx's own
  # small 404 instead of a full HTML document.
  #
  # No HTML may be cached: every one of these documents carries the hashed
  # asset filenames, so a stale copy pins the browser to a bundle the
  # deploy just deleted. `expires -1` emits Cache-Control: no-cache, and it
  # is the only directive here for the reason given above — an add_header
  # would drop every inherited security header.
  location / {
    expires -1;
    try_files $uri $uri/index.html =404;
    error_page 404 /404.html;
  }

  # The 404 body: the same app shell, with <meta name="robots" content=
  # "noindex"> and no canonical. `internal` keeps it from being fetched —
  # and indexed — under a URL of its own.
  location = /404.html {
    expires -1;
    internal;
  }
}
