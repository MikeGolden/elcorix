server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Security headers for the client site (see SECURITY.md).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://*.alteg.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Same-origin API: proxy to the Express container. The server has
  # TRUST_PROXY_HOPS=1 so rate limiting sees the real client IP.
  location /api/ {
    proxy_pass http://server:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets are immutable — cache aggressively.
  # (`expires` keeps the server-level add_header directives, a nested
  # add_header would silently drop them.)
  location /assets/ {
    expires 1y;
  }

  # SPA fallback for client-side routes (/booking, /contact, /privacy, …).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
